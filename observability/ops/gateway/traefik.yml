# Traefik static configuration (read once, when the gateway starts).
# After changing this file: docker compose restart gateway

entryPoints:
  web:
    address: ":8080"   # public entry point of the store
  ping:
    address: ":8082"   # only used by the container healthcheck

ping:
  entryPoint: ping

providers:
  file:
    filename: /etc/traefik/routes.yml

log:
  level: INFO

accessLog:
  format: json

# Every request that enters the store gets a trace id here. The services join
# that trace and write its id in each of their log lines.
tracing:
  serviceName: gateway
  otlp:
    http:
      endpoint: http://alloy:4318/v1/traces
