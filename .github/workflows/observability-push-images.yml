name: "Observability: push images"

# Builds the Otzzo images and pushes them to the registry inside the tailnet:
#   the three services       observer-cart, observer-customers, observer-orders
#   the observability tools  observer-alloy, observer-grafana, observer-prometheus,
#                            observer-tempo, observer-traffic (the upstream image
#                            plus its files in ops/)
# All of them share one version, so a change to a config in ops/ needs a release too.
#
# Runs only when a version tag is pushed, and only if the tagged commit is on master:
#   git tag v1.2.3 && git push origin v1.2.3
# v1.2.3 is pushed as 1.2.3, 1.2, 1 and latest.
on:
  push:
    tags:
      - "v*.*.*"

# Two releases pushing "latest" at once could leave the older one on top: queue them instead.
concurrency:
  group: observability-push-images
  cancel-in-progress: false

jobs:
  push:
    name: "Push observer images"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC login to Tailscale

    env:
      REGISTRY_HOST: gateway.tail9a6ddb.ts.net   # Tailscale MagicDNS name
      REGISTRY: gateway.tail9a6ddb.ts.net:5000
      IMAGE_PREFIX: observer-
      # Folders under observability/ with a Dockerfile; the image is named after the folder.
      IMAGE_DIRS: >-
        projects/cart projects/customers projects/orders
        ops/alloy ops/grafana ops/prometheus ops/tempo ops/traffic

    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history, to check the tag against master
          persist-credentials: false

      # A tag can point at any commit: refuse to release one that was never merged.
      - name: "Check the tag is on master"
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on master"
            exit 1
          fi

      # The registry speaks plain HTTP inside the tailnet (WireGuard encrypts the traffic).
      # Merged into the existing daemon.json, if any, instead of replacing it.
      - name: "Allow the tailnet registry over HTTP"
        shell: bash   # adds pipefail: a jq error must fail the step
        run: |
          current=$(sudo cat /etc/docker/daemon.json 2>/dev/null || true)
          [[ -n "$current" ]] || current='{}'
          jq --arg registry "$REGISTRY" '."insecure-registries" += [$registry]' <<< "$current" \
            | sudo tee /etc/docker/daemon.json > /dev/null
          sudo systemctl restart docker

      # The "docker" driver builds and pushes through the daemon, which reads daemon.json.
      # The default docker-container driver runs BuildKit in its own container and ignores it.
      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker

      # One tag list for all the images; the build step picks each image's lines.
      - name: "Docker metadata"
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}cart
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}customers
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}orders
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}alloy
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}grafana
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}prometheus
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}tempo
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}traffic
          # "latest" is added automatically for stable versions, never for alpha/beta.
          # No major-only tag below 1.0: a "0" tag would span breaking changes.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      # Built before joining the tailnet: the builds install third-party dependencies
      # (go mod download, pip install, npm ci), and their install scripts shouldn't be
      # able to reach it. Every image is built before anything is pushed, so a broken
      # build can't leave the registry with a half-released version.
      - name: "Build images"
        shell: bash
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          label_args=()
          while IFS= read -r label; do
            [[ -n "$label" ]] && label_args+=(--label "$label")
          done <<< "$LABELS"

          for dir in $IMAGE_DIRS; do
            image="$REGISTRY/$IMAGE_PREFIX${dir##*/}"
            tag_args=()
            while IFS= read -r tag; do
              [[ "$tag" == "$image:"* ]] && tag_args+=(--tag "$tag")
            done <<< "$TAGS"
            if [[ ${#tag_args[@]} -eq 0 ]]; then
              echo "::error::no tags computed for $image"
              exit 1
            fi

            echo "::group::Build $image"
            docker buildx build --load --provenance=false \
              "${tag_args[@]}" "${label_args[@]}" \
              "observability/$dir"
            echo "::endgroup::"
          done

      - name: "Join the tailnet"
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_OAUTH_AUDIENCE }}
          tags: tag:ci
          ping: ${{ env.REGISTRY_HOST }}   # fails here, clearly, if the registry is unreachable

      # Passes the secrets as inputs, not pasted into a script; logs out when the job ends.
      - name: "Login to registry"
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASS }}

      - name: "Push images"
        shell: bash
        run: |
          for dir in $IMAGE_DIRS; do
            docker push --all-tags "$REGISTRY/$IMAGE_PREFIX${dir##*/}"
          done
